<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Casa Gioia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --wine:      #5B1D2A;
  --wine-soft: #8d3244;
  --gold:      #c9a96e;
  --cream:     #F4EFE5;
  --text:      #2F2A28;
  --bg:        #f5f1eb;
}
body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── Top bar ── */
.admin-bar { background: var(--text); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 200; }
.admin-bar-brand { font-family: 'Cormorant Garamond', serif; font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; color: var(--cream); }
.admin-bar-brand span { color: var(--gold); margin-right: 12px; }
.admin-bar-right { display: flex; align-items: center; gap: 20px; }
.admin-logout { font-size: .68rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(244,239,229,.6); background: none; border: 1px solid rgba(244,239,229,.2); padding: 6px 14px; cursor: pointer; transition: border-color .2s, color .2s; }
.admin-logout:hover { border-color: var(--gold); color: var(--gold); }

/* ── Tabs ── */
.admin-tabs { background: white; border-bottom: 1px solid rgba(91,29,42,.1); display: flex; gap: 0; position: sticky; top: 56px; z-index: 100; }
.admin-tab { padding: 14px 28px; font-family: 'Manrope', sans-serif; font-size: .7rem; letter-spacing: 2.5px; text-transform: uppercase; color: #a09890; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: color .2s, border-color .2s; }
.admin-tab:hover { color: var(--text); }
.admin-tab.active { color: var(--wine); border-bottom-color: var(--wine); }

/* ── Main ── */
.admin-main { max-width: 1200px; margin: 0 auto; padding: 36px 32px 80px; }
.tab-section { display: none; }
.tab-section.active { display: block; }
.section-title { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; color: var(--text); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid rgba(91,29,42,.1); }

/* ── Stats ── */
.stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-bottom: 36px; }
.stat-card { background: white; padding: 22px 18px; border-left: 3px solid transparent; }
.stat-card.wine   { border-color: var(--wine); }
.stat-card.gold   { border-color: var(--gold); }
.stat-card.green  { border-color: #4caf7d; }
.stat-card.blue   { border-color: #5b8dd9; }
.stat-card.purple { border-color: #9b59b6; }
.stat-label { font-size: .62rem; letter-spacing: 2.5px; text-transform: uppercase; color: #a09890; margin-bottom: 10px; }
.stat-value { font-family: 'Cormorant Garamond', serif; font-size: 1.9rem; font-weight: 400; color: var(--text); line-height: 1; }

/* ── Charts ── */
.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-bottom: 36px; }
.chart-card { background: white; padding: 24px; }
.chart-card canvas { max-height: 240px; }

/* ── Shared table styles ── */
.table-wrap { background: white; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead { background: var(--text); }
th { padding: 14px 16px; font-size: .62rem; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(244,239,229,.6); text-align: left; font-weight: 500; white-space: nowrap; }
td { padding: 13px 16px; font-size: .82rem; color: var(--text); border-bottom: 1px solid rgba(91,29,42,.06); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fdf9f5; }

/* ── Orders ── */
.filters { display: flex; gap: 2px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-btn { padding: 8px 18px; font-family: 'Manrope', sans-serif; font-size: .68rem; letter-spacing: 2px; text-transform: uppercase; border: 1px solid rgba(91,29,42,.15); background: white; color: #7a726c; cursor: pointer; transition: background .15s; }
.filter-btn:hover  { background: var(--cream); }
.filter-btn.active { background: var(--wine); color: white; border-color: var(--wine); }
.search-bar { margin-bottom: 16px; }
.search-input { width: 100%; max-width: 360px; padding: 9px 14px; font-family: 'Manrope', sans-serif; font-size: .82rem; border: 1px solid rgba(91,29,42,.2); background: white; color: var(--text); outline: none; }
.search-input:focus { border-color: var(--wine); }
.search-input::placeholder { color: #c0b8b2; }
.order-num   { font-weight: 600; color: var(--wine); font-size: .78rem; }
.order-email { color: #7a726c; font-size: .8rem; }
.order-date  { color: #a09890; font-size: .78rem; white-space: nowrap; }
.order-total { font-weight: 600; }
.badge { display: inline-block; padding: 3px 10px; font-size: .62rem; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; white-space: nowrap; }
.badge-pendiente  { background: #fff3cd; color: #856404; }
.badge-confirmado { background: #d4edda; color: #155724; }
.badge-preparando { background: #cce5ff; color: #004085; }
.badge-en_camino  { background: #e2d9f3; color: #432874; }
.badge-entregado  { background: #d4edda; color: #0a4020; }
.badge-cancelado  { background: #f8d7da; color: #721c24; }
.estado-select { font-family: 'Manrope', sans-serif; font-size: .72rem; padding: 5px 10px; border: 1px solid rgba(91,29,42,.2); background: white; color: var(--text); cursor: pointer; outline: none; }
.estado-select:focus { border-color: var(--wine); }
.saving { opacity: .4; pointer-events: none; }
.save-ok td { background: #f0fff4 !important; }

/* ── Products section ── */
.prod-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.btn-add-prod { background: var(--wine); color: white; border: none; padding: 10px 22px; font-family: 'Manrope', sans-serif; font-size: .68rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: opacity .2s; }
.btn-add-prod:hover { opacity: .85; }
.prod-img-thumb { width: 48px; height: 48px; object-fit: cover; display: block; }
.prod-img-placeholder { width: 48px; height: 48px; background: #f0ebe3; display: flex; align-items: center; justify-content: center; color: #c0b8b2; font-size: .7rem; }
.prod-name { font-weight: 500; }
.prod-cats { font-size: .72rem; color: #a09890; margin-top: 2px; }
.prod-precio { font-weight: 600; }
.activo-badge { display: inline-block; padding: 2px 8px; font-size: .6rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
.activo-si  { background: #d4edda; color: #155724; }
.activo-no  { background: #f8d7da; color: #721c24; }
.btn-icon { background: none; border: none; cursor: pointer; padding: 4px 8px; font-size: .78rem; color: #a09890; transition: color .15s; }
.btn-icon:hover { color: var(--wine); }

/* ── Product form panel ── */
.prod-form-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 500; overflow-y: auto; padding: 40px 16px; }
.prod-form-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
.prod-form-box { background: white; width: 100%; max-width: 620px; padding: 40px; position: relative; }
.prod-form-title { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 400; margin-bottom: 28px; }
.prod-form-close { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #a09890; line-height: 1; }
.prod-form-close:hover { color: var(--text); }
.form-row { margin-bottom: 20px; }
.form-row label { display: block; font-size: .65rem; letter-spacing: 2px; text-transform: uppercase; color: #a09890; margin-bottom: 8px; }
.form-row input[type="text"],
.form-row input[type="number"],
.form-row textarea { width: 100%; padding: 10px 12px; border: 1px solid rgba(91,29,42,.2); font-family: 'Manrope', sans-serif; font-size: .85rem; color: var(--text); background: white; outline: none; resize: vertical; }
.form-row input:focus,
.form-row textarea:focus { border-color: var(--wine); }
.cat-checkboxes { display: flex; gap: 16px; flex-wrap: wrap; }
.cat-check { display: flex; align-items: center; gap: 6px; font-size: .8rem; cursor: pointer; }
.cat-check input { accent-color: var(--wine); width: 14px; height: 14px; }

.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.toggle-row { display: flex; align-items: center; gap: 12px; }
.toggle-row label { font-size: .65rem; letter-spacing: 2px; text-transform: uppercase; color: #a09890; margin: 0; }
.toggle { width: 40px; height: 22px; background: #ddd; border-radius: 11px; position: relative; cursor: pointer; transition: background .2s; }
.toggle.on { background: #4caf7d; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: white; border-radius: 50%; transition: left .2s; }
.toggle.on::after { left: 21px; }

.form-actions { display: flex; gap: 12px; margin-top: 32px; justify-content: flex-end; }
.btn-save { background: var(--wine); color: white; border: none; padding: 11px 28px; font-family: 'Manrope', sans-serif; font-size: .7rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: opacity .2s; }
.btn-save:hover { opacity: .85; }
.btn-save:disabled { opacity: .5; cursor: not-allowed; }
.btn-cancel-form { background: none; border: 1px solid rgba(91,29,42,.2); color: #7a726c; padding: 11px 20px; font-family: 'Manrope', sans-serif; font-size: .7rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: border-color .2s; }
.btn-cancel-form:hover { border-color: var(--wine); color: var(--wine); }

/* ── Photos list ── */
.fotos-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.foto-item { display: flex; align-items: center; gap: 10px; background: #fdf9f5; padding: 8px; border: 1px solid rgba(91,29,42,.07); }
.foto-item-num { font-family: 'Cormorant Garamond',serif; font-size: .95rem; color: #a09890; min-width: 18px; text-align: center; flex-shrink: 0; }
.foto-item-thumb { width: 54px; height: 54px; object-fit: cover; flex-shrink: 0; display: block; }
.foto-item-actions { display: flex; gap: 5px; margin-left: auto; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.btn-foto-act { border: 1px solid rgba(91,29,42,.15); background: white; cursor: pointer; padding: 4px 9px; font-size: .7rem; color: #7a726c; transition: background .15s, border-color .15s; white-space: nowrap; font-family: 'Manrope',sans-serif; }
.btn-foto-act:hover:not(:disabled) { background: var(--cream); color: var(--wine); border-color: var(--wine); }
.btn-foto-act:disabled { opacity: .22; cursor: default; }
.btn-foto-del { border-color: rgba(192,57,43,.18); color: #c0392b; }
.btn-foto-del:hover:not(:disabled) { background: #fdf0f0 !important; border-color: #c0392b !important; color: #c0392b !important; }
.btn-add-foto { border: 2px dashed rgba(91,29,42,.2); background: none; padding: 10px; cursor: pointer; color: #a09890; font-size: .72rem; letter-spacing: 1.5px; text-transform: uppercase; transition: border-color .2s, color .2s; width: 100%; margin-top: 8px; font-family: 'Manrope',sans-serif; }
.btn-add-foto:hover { border-color: var(--wine); color: var(--wine); }
.btn-delete-prod { background: none; border: none; cursor: pointer; padding: 4px 8px; font-size: .78rem; color: #c0392b; transition: opacity .15s; }
.btn-delete-prod:hover { opacity: .7; }

/* ── Crop picker modal ── */
.crop-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 700; align-items: center; justify-content: center; padding: 20px; }
.crop-overlay.open { display: flex; }
.crop-box { background: white; padding: 24px; width: 100%; max-width: 560px; max-height: 90vh; display: flex; flex-direction: column; gap: 0; }
.crop-box-title { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; margin-bottom: 4px; flex-shrink: 0; }
.crop-box-hint { font-size: .68rem; color: #a09890; margin-bottom: 14px; line-height: 1.5; flex-shrink: 0; }
.crop-picker-area { position: relative; line-height: 0; overflow: hidden; user-select: none; flex: 1; min-height: 80px; }
.crop-picker-area img { width: 100%; height: auto; display: block; pointer-events: none; }
.crop-rect { position: absolute; border: 2px solid white; box-shadow: 0 0 0 9999px rgba(0,0,0,.52); cursor: grab; box-sizing: border-box; }
.crop-rect:active { cursor: grabbing; }

/* ── Carritos tab ── */
.carrito-email { color: #7a726c; font-size: .8rem; }
.carrito-fecha  { color: #a09890; font-size: .78rem; white-space: nowrap; }
.carrito-items  { font-size: .78rem; color: var(--text); }

/* ── Misc ── */
.admin-loading { text-align: center; padding: 80px 32px; font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: #a09890; }
.admin-empty { text-align: center; padding: 40px 32px; color: #a09890; font-size: .88rem; }

@media (max-width: 900px) {
  .stats-grid { grid-template-columns: repeat(3, 1fr); }
  .charts-grid { grid-template-columns: 1fr; }
  .form-row-2 { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .admin-main { padding: 24px 16px 60px; }
}
</style>
</head>
<body>

<div class="admin-bar">
  <div class="admin-bar-brand"><span>◆</span>Admin · Casa Gioia</div>
  <div class="admin-bar-right">
    <button class="admin-logout" id="logoutBtn">Salir</button>
  </div>
</div>

<div class="admin-tabs">
  <button class="admin-tab active" data-tab="pedidos"   onclick="switchTab('pedidos')">Pedidos</button>
  <button class="admin-tab"        data-tab="productos" onclick="switchTab('productos')">Productos</button>
  <button class="admin-tab"        data-tab="carritos"  onclick="switchTab('carritos')">Carritos</button>
</div>

<div class="admin-main">
  <div class="admin-loading" id="loadingMsg">Cargando…</div>

  <!-- ═══ TAB: PEDIDOS ═══ -->
  <div class="tab-section" id="tab-pedidos"></div>

  <!-- ═══ TAB: PRODUCTOS ═══ -->
  <div class="tab-section" id="tab-productos"></div>

  <!-- ═══ TAB: CARRITOS ═══ -->
  <div class="tab-section" id="tab-carritos"></div>
</div>

<!-- ═══ FORMULARIO DE PRODUCTO (modal) ═══ -->
<div class="prod-form-overlay" id="prodFormOverlay">
  <div class="prod-form-box">
    <button class="prod-form-close" onclick="closeProdForm()">✕</button>
    <div class="prod-form-title" id="prodFormTitle">Nuevo producto</div>

    <div class="form-row-2">
      <div class="form-row">
        <label>Nombre</label>
        <input type="text" id="pf-nombre" placeholder="Ej: Vestido Lino Venezia" maxlength="120">
      </div>
      <div class="form-row">
        <label>Precio (ARS)</label>
        <input type="number" id="pf-precio" placeholder="89990" min="1" max="99999999">
      </div>
    </div>

    <div class="form-row-2">
      <div class="form-row">
        <label>Stock (vacío = ilimitado)</label>
        <input type="number" id="pf-stock" placeholder="Ej: 10" min="0" max="9999">
      </div>
      <div class="form-row" style="display:flex;flex-direction:column;justify-content:flex-end;">
        <div class="toggle-row">
          <div class="toggle on" id="pfToggle" onclick="toggleActivo()"></div>
          <label>Activo (visible en tienda)</label>
        </div>
      </div>
    </div>

    <div class="form-row-2">
      <div class="form-row">
        <label>Dimensiones</label>
        <input type="text" id="pf-dimensiones" placeholder="Ej: 40×30×20 cm" maxlength="80">
      </div>
      <div class="form-row">
        <label>Peso</label>
        <input type="text" id="pf-peso" placeholder="Ej: 1.2 kg" maxlength="40">
      </div>
    </div>

    <div class="form-row">
      <label>Descripción</label>
      <textarea id="pf-desc" rows="3" placeholder="Descripción del producto…" maxlength="1000"></textarea>
    </div>

    <div class="form-row">
      <label>Categorías</label>
      <div class="cat-checkboxes">
        <label class="cat-check"><input type="checkbox" value="accesorios"> Accesorios</label>
        <label class="cat-check"><input type="checkbox" value="deco"> Deco</label>
        <label class="cat-check"><input type="checkbox" value="deli"> Deli</label>
        <label class="cat-check"><input type="checkbox" value="muebles"> Muebles</label>
      </div>
    </div>

    <div class="form-row">
      <label>Fotos</label>
      <div class="fotos-list" id="fotosGrid"></div>
      <button type="button" class="btn-add-foto" onclick="document.getElementById('pf-fotos-input').click()">+ Agregar foto</button>
      <input type="file" id="pf-fotos-input" accept="image/jpeg,image/png,image/webp" style="display:none;" multiple>
    </div>

    <div class="form-actions">
      <button class="btn-cancel-form" onclick="closeProdForm()">Cancelar</button>
      <button class="btn-save" id="btnSaveProd" onclick="saveProd()">Guardar producto</button>
    </div>
  </div>
</div>

<!-- Crop picker modal -->
<div class="crop-overlay" id="cropOverlay">
  <div class="crop-box">
    <div class="crop-box-title">Elegí el área que se va a mostrar</div>
    <div class="crop-box-hint">El recuadro blanco representa exactamente lo que se va a ver en la tienda. Arrastralo para reposicionarlo.</div>
    <div class="crop-picker-area" id="cropPickerArea">
      <img id="cropImg" src="" alt="">
      <div class="crop-rect" id="cropRect"></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:flex-end;flex-shrink:0;">
      <button class="btn-cancel-form" onclick="closeCropPicker()">Cancelar</button>
      <button class="btn-save" onclick="confirmCrop()">Confirmar</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js'

function makeStorage() {
  const mem = {}
  const tryLocal = () => { try { localStorage.setItem('_cg','1'); localStorage.removeItem('_cg'); return true } catch { return false } }
  const trySession = () => { try { sessionStorage.setItem('_cg','1'); sessionStorage.removeItem('_cg'); return true } catch { return false } }
  return tryLocal() ? localStorage : trySession() ? sessionStorage : { getItem: k => mem[k] ?? null, setItem: (k,v) => { mem[k]=v }, removeItem: k => { delete mem[k] } }
}

const supabase = createClient(
  'https://dzuymtiutglcyrdcxkaj.supabase.co',
  'sb_publishable_D29AA8KYQ1pz2LCcqSJUGw_OyTvLAC9',
  { auth: { storage: makeStorage(), persistSession: true, detectSessionInUrl: true } }
)

const FN_ORDERS   = 'https://dzuymtiutglcyrdcxkaj.supabase.co/functions/v1/admin-orders'
const FN_PRODUCTS = 'https://dzuymtiutglcyrdcxkaj.supabase.co/functions/v1/admin-products'
const ANON_KEY    = 'sb_publishable_D29AA8KYQ1pz2LCcqSJUGw_OyTvLAC9'
const BUCKET      = 'product-images'

const { data: { session } } = await supabase.auth.getSession()
if (!session) { window.location.href = 'login.html' }

document.getElementById('logoutBtn').onclick = async () => {
  await supabase.auth.signOut()
  window.location.href = 'index.html'
}

// ═══════════════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════════════
function authHeaders(extra = {}) {
  return { 'Authorization': `Bearer ${session.access_token}`, 'apikey': ANON_KEY, 'Content-Type': 'application/json', ...extra }
}

async function apiFetch(url, opts = {}) {
  const res = await fetch(url, { headers: authHeaders(), ...opts })
  if (res.status === 401) { window.location.href = 'index.html'; throw new Error('no auth') }
  return res.json()
}

// ═══════════════════════════════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════════════════════════════
window.switchTab = (tab) => {
  document.querySelectorAll('.admin-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab))
  document.querySelectorAll('.tab-section').forEach(s => s.classList.toggle('active', s.id === `tab-${tab}`))
}

// ═══════════════════════════════════════════════════════════════════════
//  PEDIDOS
// ═══════════════════════════════════════════════════════════════════════
const ESTADOS = ['pendiente','confirmado','preparando','en_camino','entregado','cancelado']
const ESTADO_LABEL = { pendiente:'Pendiente', confirmado:'Confirmado', preparando:'Preparando', en_camino:'En camino', entregado:'Entregado', cancelado:'Cancelado' }
let allPedidos = []
let userCount  = 0
let activeFilter = 'todos'
let searchQuery  = ''
let chartStatus  = null
let chartRevenue = null

async function fetchPedidos() {
  const data = await apiFetch(FN_ORDERS)
  userCount  = data.user_count ?? 0
  return data.pedidos ?? []
}

async function updateEstado(id, estado, selectEl) {
  const row = selectEl.closest('tr')
  row.classList.add('saving')
  try {
    const data = await apiFetch(FN_ORDERS, { method: 'POST', body: JSON.stringify({ id, estado }) })
    if (data.ok) {
      const p = allPedidos.find(p => p.id === id)
      if (p) p.estado = estado
      const b = row.querySelector('.badge')
      if (b) { b.className = `badge badge-${estado}`; b.textContent = ESTADO_LABEL[estado] }
      row.classList.add('save-ok'); setTimeout(() => row.classList.remove('save-ok'), 1200)
      renderStats(); renderCharts()
    } else {
      alert('Error: ' + (data.error ?? 'desconocido'))

let _cropIdx  = null
let _cropDrag = null

window.openCropPicker = (idx) => {
  _cropIdx = idx
  const ph  = photos[idx]
  const src = ph.file ? URL.createObjectURL(ph.file) : ph.url
  const img = document.getElementById('cropImg')
  img.src   = src
  document.getElementById('cropOverlay').classList.add('open')
  if (img.complete && img.naturalWidth) _initCropRect(ph.focal)
  else img.onload = () => _initCropRect(ph.focal)
}

function _initCropRect(focal) {
  const img  = document.getElementById('cropImg')
  const area = document.getElementById('cropPickerArea')
  const rect = document.getElementById('cropRect')
  const aW = area.offsetWidth
  const aH = img.offsetHeight
  const ir = img.naturalWidth / img.naturalHeight
  const br = 4 / 3
  let rW, rH
  if (ir > br) { rH = aH; rW = aH * br } else { rW = aW; rH = aW / br }
  rW = Math.min(Math.round(rW), aW)
  rH = Math.min(Math.round(rH), aH)
  rect.style.width  = rW + 'px'
  rect.style.height = rH + 'px'
  const maxL = aW - rW
  const maxT = aH - rH
  let xP = 50, yP = 50
  if (focal) { const [xs, ys] = focal.split(' '); xP = parseFloat(xs); yP = parseFloat(ys) }
  rect.style.left = Math.round(xP / 100 * maxL) + 'px'
  rect.style.top  = Math.round(yP / 100 * maxT) + 'px'
}

document.getElementById('cropRect').addEventListener('mousedown', (e) => {
  e.preventDefault()
  const rect = document.getElementById('cropRect')
  const area = document.getElementById('cropPickerArea')
  const aR   = area.getBoundingClientRect()
  const rR   = rect.getBoundingClientRect()
  _cropDrag  = { sx: e.clientX, sy: e.clientY, sl: rR.left - aR.left, st: rR.top - aR.top, maxL: aR.width - rR.width, maxT: aR.height - rR.height }
})
document.addEventListener('mousemove', (e) => {
  if (!_cropDrag) return
  const rect = document.getElementById('cropRect')
  rect.style.left = Math.max(0, Math.min(_cropDrag.maxL, _cropDrag.sl + e.clientX - _cropDrag.sx)) + 'px'
  rect.style.top  = Math.max(0, Math.min(_cropDrag.maxT, _cropDrag.st + e.clientY - _cropDrag.sy)) + 'px'
})
document.addEventListener('mouseup', () => { _cropDrag = null })
document.getElementById('cropRect').addEventListener('touchstart', (e) => {
  const t = e.touches[0]; e.preventDefault()
  const rect = document.getElementById('cropRect')
  const area = document.getElementById('cropPickerArea')
  const aR   = area.getBoundingClientRect()
  const rR   = rect.getBoundingClientRect()
  _cropDrag  = { sx: t.clientX, sy: t.clientY, sl: rR.left - aR.left, st: rR.top - aR.top, maxL: aR.width - rR.width, maxT: aR.height - rR.height }
}, { passive: false })
document.addEventListener('touchmove', (e) => {
  if (!_cropDrag) return; e.preventDefault()
  const t    = e.touches[0]
  const rect = document.getElementById('cropRect')
  rect.style.left = Math.max(0, Math.min(_cropDrag.maxL, _cropDrag.sl + t.clientX - _cropDrag.sx)) + 'px'
  rect.style.top  = Math.max(0, Math.min(_cropDrag.maxT, _cropDrag.st + t.clientY - _cropDrag.sy)) + 'px'
}, { passive: false })
document.addEventListener('touchend', () => { _cropDrag = null })

window.confirmCrop = () => {
  const rect = document.getElementById('cropRect')
  const area = document.getElementById('cropPickerArea')
  const maxL = area.offsetWidth  - rect.offsetWidth
  const maxT = area.offsetHeight - rect.offsetHeight
  const xP   = maxL > 0 ? Math.round((parseInt(rect.style.left) || 0) / maxL * 100) : 50
  const yP   = maxT > 0 ? Math.round((parseInt(rect.style.top)  || 0) / maxT * 100) : 50
  photos[_cropIdx].focal = `${xP}% ${yP}%`
  closeCropPicker()
  renderPhotoList()
}

window.saveProd = async () => {
  const nombre      = document.getElementById('pf-nombre').value.trim()
  const precio      = parseInt(document.getElementById('pf-precio').value, 10)
  const stockRaw    = document.getElementById('pf-stock').value.trim()
  const dimensiones = document.getElementById('pf-dimensiones').value.trim() || null
  const peso        = document.getElementById('pf-peso').value.trim() || null
  const desc        = document.getElementById('pf-desc').value.trim()
  const cats        = [...document.querySelectorAll('.cat-check input:checked')].map(c => c.value)

  if (!nombre)              { alert('Ingresá el nombre del producto.'); return }
  if (!precio || precio <= 0) { alert('Ingresá un precio válido.'); return }
  const stock = stockRaw === '' ? null : parseInt(stockRaw, 10)
  if (stock !== null && (isNaN(stock) || stock < 0)) { alert('Stock inválido.'); return }

  const btn = document.getElementById('btnSaveProd')
  btn.disabled = true; btn.textContent = 'Guardando…'

  const prodId = editingProdId ?? crypto.randomUUID()
  const ts     = Date.now()

  try {
    // Subir fotos nuevas y construir array final en orden
    const resolved = []
    for (let i = 0; i < photos.length; i++) {
      const ph = photos[i]
      if (ph.file) {
        const ext  = ph.file.name.split('.').pop()?.toLowerCase() || 'jpg'
        const path = `${prodId}-foto-${ts}-${i}.${ext}`
        const { error: upErr } = await supabase.storage.from(BUCKET).upload(path, ph.file, { upsert: true, contentType: ph.file.type })
        if (upErr) throw new Error('Error subiendo foto: ' + upErr.message)
        const { data: urlData } = supabase.storage.from(BUCKET).getPublicUrl(path)
        resolved.push({ url: urlData.publicUrl, focal: ph.focal })
      } else {
        resolved.push({ url: ph.url, focal: ph.focal })
      }
    }

    // Primera foto → imagen_url, resto → fotos[]
    const imagen_url   = resolved[0]?.url   ?? null
    const imagen_focal = resolved[0]?.focal ?? null
    const fotos        = resolved.slice(1).map(p => p.url)
    const fotos_focal  = resolved.slice(1).map(p => p.focal ?? null)

    const method  = editingProdId ? 'PUT' : 'POST'
    const payload = {
      nombre, precio, descripcion: desc || null, categoria: cats,
      imagen_url, imagen_focal,
      fotos, fotos_focal,
      activo: pfActivo, stock, dimensiones, peso,
      ...(editingProdId ? { id: editingProdId } : {}),
    }
    const data = await apiFetch(FN_PRODUCTS, { method, body: JSON.stringify(payload) })
    if (data.error) throw new Error(data.error)

    if (editingProdId) {
      const idx = allProductos.findIndex(p => p.id === editingProdId)
      if (idx >= 0) allProductos[idx] = data.producto
    } else {
      allProductos.unshift(data.producto)
    }

    renderProductTable()
    closeProdForm()
  } catch(e) {
    alert('Error: ' + e.message)
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar producto'
  }
}

window.toggleProdActivo = async (id, nuevoActivo) => {

  const data = await apiFetch(FN_PRODUCTS, { method: 'PUT', body: JSON.stringify({
    id, nombre: p.nombre, precio: p.precio, descripcion: p.descripcion,
    categoria: p.categoria, imagen_url: p.imagen_url, imagen_focal: p.imagen_focal ?? null,
    fotos: p.fotos ?? [], fotos_focal: p.fotos_focal ?? [],
    activo: nuevoActivo, stock: p.stock ?? null,
    dimensiones: p.dimensiones ?? null, peso: p.peso ?? null,
  }) })
  if (data.error) { alert('Error: ' + data.error); return }
  p.activo = nuevoActivo
  renderProductTable()
}

window.deleteProd = async (id, nombre) => {
  if (!confirm(`¿Eliminar "${nombre}" definitivamente? Esta acción no se puede deshacer.`)) return
  const data = await apiFetch(FN_PRODUCTS, { method: 'DELETE', body: JSON.stringify({ id }) })

  allProductos = allProductos.filter(p => p.id !== id)
  renderProductTable()
}

  tbody.innerHTML = allCarritos.map(c => {
    const items  = Array.isArray(c.items) ? c.items : []
    const total  = items.reduce((s, i) => s + (Number(i.precio) || 0) * (Number(i.qty) || 1), 0)
    const lista  = items.map(i => `${i.nombre ?? i.id} ×${i.qty ?? 1}`).join(', ') || '—'
    const fecha  = c.updated_at ? new Date(c.updated_at).toLocaleDateString('es-AR', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—'
    return `<tr>
      <td><div class="carrito-email">${c.cliente_email ?? '—'}</div></td>
      <td><div class="carrito-fecha">${fecha}</div></td>
      <td><div class="carrito-items">${lista}</div></td>
      <td>$${total.toLocaleString('es-AR')}</td>
    </tr>`
  }).join('')
}

// ═══════════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════════
try {
  const [pedidosResult, productosResult, carritosResult] = await Promise.allSettled([
    fetchPedidos(), fetchProductos(), fetchCarritos()
  ])

  allPedidos   = pedidosResult.status   === 'fulfilled' ? pedidosResult.value   : []
  allProductos = productosResult.status === 'fulfilled' ? productosResult.value : []
  allCarritos  = carritosResult.status  === 'fulfilled' ? carritosResult.value  : []

  document.getElementById('loadingMsg').style.display = 'none'

  buildPedidosUI()
  buildProductosUI()
  buildCarritosUI()
  switchTab('pedidos')

  renderStats()
  renderCharts()
  renderOrderTable()
  renderProductTable()
  renderCarritosTable()

  if (productosResult.status === 'rejected' && productosResult.reason?.message !== 'no auth') {
    document.getElementById('tbody-prods').innerHTML =
      `<tr><td colspan="6" class="admin-empty">Error al cargar productos. Verificá que la tabla exista en Supabase.</td></tr>`
  }
} catch(e) {
  if (e.message !== 'no auth') {
    document.getElementById('loadingMsg').textContent = 'Error al cargar: ' + e.message
  }
}
</script>
</body>
</html>
