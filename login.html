<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="css/estilos.css">

</head>
<body>

<div class="login-box">

    <h1>Casa Gioia</h1>

    <p class="auth-subtitle">
        Accedé a tu cuenta o creá una nueva.
    </p>

    <button class="google-btn" onclick="googleLogin()">

        <!-- SVG de Google -->

        <span>Continuar con Google</span>

    </button>
<p id="mensaje"></p>
    <div class="divider">
        <span>o</span>
    </div>

    <input
        id="email"
        type="email"
        placeholder="Correo electrónico">

    <input
        id="password"
        type="password"
        placeholder="Contraseña">

    <button
        class="btn-primary"
        onclick="login()">

        Ingresar

    </button>
<p id="mensaje"></p>
    <button
        class="btn-secondary"
        onclick="register()">

        Crear cuenta

    </button>
<p id="mensaje"></p>
    <p id="mensaje"></p>

</div>

<script type="module">

import { createClient }
from 'https://esm.sh/@supabase/supabase-js'

const supabase = createClient(
  'https://dzuymtiutglcyrdcxkaj.supabase.co',
  'sb_publishable_D29AA8KYQ1pz2LCcqSJUGw_OyTvLAC9'
)
const {
  data:{session}
} = await supabase.auth.getSession()

if(session){

    window.location.href = "index.html"

}
supabase.auth.onAuthStateChange((event, session) => {

    if(session){

        window.location.href = "index.html"

    }

})

window.login = async () => {

    const email =
    document.getElementById("email").value

    const password =
    document.getElementById("password").value

    const { error } =
    await supabase.auth.signInWithPassword({
        email,
        password
    })

    if(error){

        document.getElementById("mensaje")
        .innerText = error.message

        return
    }

}
window.register = async () => {

    const email =
    document.getElementById("email").value

    const password =
    document.getElementById("password").value

    const { error } =
    await supabase.auth.signUp({
        email,
        password
    })

    const mensaje =
    document.getElementById("mensaje")

    if(error){

        mensaje.innerText =
        error.message

        return
    }

    mensaje.innerText =
    "Cuenta creada correctamente. Ya podés ingresar."

}
window.googleLogin = async () => {

    await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
            redirectTo: window.location.origin + '/pedro/yoia/index.html'
        }
    })

}

</script>

</body>
</html>
