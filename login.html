<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ingresar — Casa Gioia</title>

<link rel="stylesheet" href="css/estilos.css?v=20260805">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
.popup-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
    z-index:3000;opacity:0;pointer-events:none;transition:opacity .22s ease;
}
.popup-overlay.visible{ opacity:1; pointer-events:auto; }
.popup-box{
    background:var(--cream);padding:48px 52px 40px;max-width:400px;width:90%;
    text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.14);
    transform:translateY(-12px) scale(.97);transition:transform .22s ease;
}
.popup-overlay.visible .popup-box{ transform:translateY(0) scale(1); }
.popup-icon{ font-size:2rem;margin-bottom:14px;display:block; }
.popup-title{ font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:500;margin-bottom:10px;color:var(--text); }
.popup-msg{ font-size:.85rem;line-height:1.7;color:#6b6460;margin-bottom:28px; }
.popup-btn{
    background:var(--wine);color:white;border:none;padding:11px 32px;
    font-family:'Manrope',sans-serif;font-size:.75rem;letter-spacing:1.5px;
    text-transform:uppercase;cursor:pointer;transition:background .2s;
}
.popup-btn:hover{ background:#6d1542; }

.btn-link{
    background:none;border:none;color:var(--wine-soft);
    font-family:'Manrope',sans-serif;font-size:.75rem;letter-spacing:.5px;
    cursor:pointer;padding:2px 0;text-decoration:underline;
    text-underline-offset:3px;transition:color .2s;margin-top:4px;
}
.btn-link:hover{ color:var(--wine); }
.auth-panel{ transition:opacity .18s ease; }

.btn-primary:disabled,
.btn-secondary:disabled{
    opacity:.5;
    cursor:not-allowed;
}
.turnstile-wrap{
    display:flex;
    justify-content:center;
    margin:-24px auto 0;
    opacity:.55;
    transition:opacity .2s;
}
.turnstile-wrap:hover{ opacity:.85; }
.age-check {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    cursor: pointer;
}
.age-check input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--wine);
    flex-shrink: 0;
    cursor: pointer;
}
.age-check span {
    font-family: 'Manrope', sans-serif;
    font-size: .73rem;
    color: #7a726c;
    line-height: 1.4;
}
.lockout-msg{
    font-family:'Manrope',sans-serif;
    font-size:.72rem;
    color:#c0392b;
    letter-spacing:.5px;
    text-align:center;
    margin-top:4px;
    min-height:1em;
}
</style>

</head>
<body>

<header>
<nav class="navbar" id="navbar">
  <div class="logo">
    <a href="/" style="text-decoration:none;color:inherit;">CASA GIOIA</a>
    <span>Moda • Hogar • Design</span>
  </div>
  <button class="mobile-toggle" id="mobileToggle">☰</button>
  <ul class="menu" id="menu">
    <li class="has-submenu">
      <a href="coleccion">Collezione <span class="submenu-arrow">▾</span></a>
      <ul class="submenu">
        <li><button class="submenu-btn">Deco</button></li>
        <li><button class="submenu-btn">Accesorios</button></li>
        <li><button class="submenu-btn">Muebles</button></li>
        <li><button class="submenu-btn">Deli</button></li>
      </ul>
    </li>
    <li><a href="la-casa">Interiorismo</a></li>
    <li><a href="journal">Storia</a></li>
    <li><a href="novita">Novità</a></li>
    <li><a href="contacto">Contacto</a></li>
  </ul>
  <button class="btn-nav" id="userBtn" style="opacity:1;">Ingresar</button>
</nav>
</header>

<!-- POPUP -->
<div class="popup-overlay" id="popup">
  <div class="popup-box">
    <span class="popup-icon" id="popup-icon"></span>
    <div class="popup-title" id="popup-title"></div>
    <p class="popup-msg" id="popup-msg"></p>
    <button class="popup-btn" onclick="cerrarPopup()">OK</button>
  </div>
</div>

<div class="login-box">

    <h1>Casa Gioia</h1>

    <!-- ── PANEL LOGIN ── -->
    <div id="panel-login" class="auth-panel">

        <p class="auth-subtitle">Accedé a tu cuenta o creá una nueva.</p>

        <button class="google-btn" onclick="googleLogin()">
            <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              <path fill="none" d="M0 0h48v48H0z"/>
            </svg>
            <span>Continuar con Google</span>
        </button>

        <div class="divider"><span>o</span></div>

        <input id="email"    type="email"    placeholder="Correo electrónico" autocomplete="email"            maxlength="254" spellcheck="false" autocorrect="off" autocapitalize="off">
        <input id="password" type="password" placeholder="Contraseña"         autocomplete="current-password" maxlength="128">

        <button class="btn-primary"   id="loginBtn"    onclick="login()">Ingresar</button>
        <p class="lockout-msg" id="lockout-msg"></p>
        <button class="btn-link"      id="forgotBtn">¿Olvidaste tu contraseña?</button>

        <label class="age-check">
          <input type="checkbox" id="ageCheck">
          <span>Confirmo que tengo 13 años o más</span>
        </label>

        <button class="btn-secondary" id="registerBtn" onclick="register()">Crear cuenta</button>

    </div>

    <!-- ── PANEL RECUPERAR CONTRASEÑA ── -->
    <div id="panel-recovery" class="auth-panel" style="display:none;">

        <p class="auth-subtitle">Ingresá tu email y te mandamos un link para restablecer tu contraseña.</p>

        <input id="recovery-email" type="email" placeholder="Correo electrónico" autocomplete="email" maxlength="254" spellcheck="false" autocorrect="off" autocapitalize="off">

        <button class="btn-primary" id="recoveryBtn" onclick="recuperarPassword()">Enviar link</button>
        <button class="btn-link"    id="backBtn">← Volver al inicio</button>

    </div>

</div>

<!-- Turnstile widgets fuera del recuadro -->
<div class="turnstile-wrap" id="tw-login">
    <div class="cf-turnstile"
         data-sitekey="0x4AAAAAAD90vJj47EWzV6lT"
         data-theme="light"
         data-callback="onTurnstileLogin"
         data-expired-callback="onTurnstileLoginExpired">
    </div>
</div>
<div class="turnstile-wrap" id="tw-recovery" style="display:none;">
    <div class="cf-turnstile"
         data-sitekey="0x4AAAAAAD90vJj47EWzV6lT"
         data-theme="light"
         data-callback="onTurnstileRecovery"
         data-expired-callback="onTurnstileRecoveryExpired">
    </div>
</div>

<script src="js/script.js"></script>
<script type="module">

import { supabase } from './js/supabase-client.js'

const { data:{ session } } = await supabase.auth.getSession()
if(session) window.location.href = '/'

supabase.auth.onAuthStateChange((event, session) => {
    if(session) window.location.href = '/'
})

/* ── Popup ── */
let _popupCb = null

window.mostrarPopup = (tipo, mensaje, onClose = null) => {
    _popupCb = onClose
    document.getElementById('popup-icon').textContent  = tipo === 'ok' ? '✓' : '!'
    document.getElementById('popup-title').textContent = tipo === 'ok' ? '¡Listo!' : 'Algo salió mal'
    document.getElementById('popup-msg').textContent   = mensaje
    document.getElementById('popup').classList.add('visible')
}

window.cerrarPopup = () => {
    document.getElementById('popup').classList.remove('visible')
    if (_popupCb) { const cb = _popupCb; _popupCb = null; cb() }
}

/* ── Toggle paneles ── */
document.getElementById('forgotBtn').addEventListener('click', () => {
    document.getElementById('panel-login').style.display    = 'none'
    document.getElementById('panel-recovery').style.display = 'block'
    document.getElementById('recovery-email').value = document.getElementById('email').value.trim()
    document.getElementById('tw-login').style.display    = 'none'
    document.getElementById('tw-recovery').style.display = 'flex'
})

document.getElementById('backBtn').addEventListener('click', () => {
    document.getElementById('panel-recovery').style.display = 'none'
    document.getElementById('panel-login').style.display    = 'block'
    document.getElementById('tw-recovery').style.display = 'none'
    document.getElementById('tw-login').style.display    = 'flex'
})

/* ── Turnstile tokens ── */
let tokenLogin    = null
let tokenRecovery = null

window.onTurnstileLogin          = (t) => { tokenLogin    = t }
window.onTurnstileLoginExpired   = ()  => { tokenLogin    = null }
window.onTurnstileRecovery       = (t) => { tokenRecovery = t }
window.onTurnstileRecoveryExpired= ()  => { tokenRecovery = null }

/* ── Helpers de UI ── */
function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId)
    btn.disabled = loading
    btn.style.opacity = loading ? '.6' : ''
}

function validarEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
}

/* ── Protección contra fuerza bruta (client-side) ── */
let intentosFallidos = 0
let bloqueadoHasta   = 0
let lockoutInterval  = null

function verificarBloqueo() {
    if (Date.now() < bloqueadoHasta) {
        const seg = Math.ceil((bloqueadoHasta - Date.now()) / 1000)
        document.getElementById('lockout-msg').textContent = `Demasiados intentos. Esperá ${seg}s.`
        document.getElementById('loginBtn').disabled = true
        return true
    }
    document.getElementById('lockout-msg').textContent = ''
    document.getElementById('loginBtn').disabled = false
    return false
}

function registrarFallo() {
    intentosFallidos++
    if (intentosFallidos >= 5) {
        bloqueadoHasta   = Date.now() + 300000  // 5 minutos
        intentosFallidos = 0
        if (lockoutInterval) clearInterval(lockoutInterval)
        lockoutInterval = setInterval(() => {
            if (Date.now() >= bloqueadoHasta) clearInterval(lockoutInterval)
            verificarBloqueo()
        }, 1000)
        verificarBloqueo()
    }
}

function validarPasswordFuerte(password) {
    if (password.length < 8)          return 'La contraseña debe tener al menos 8 caracteres.'
    if (!/[A-Z]/.test(password))      return 'La contraseña debe tener al menos una mayúscula.'
    if (!/[0-9]/.test(password))      return 'La contraseña debe tener al menos un número.'
    return null
}

/* ── Traducción de errores ── */
function traducirError(msg) {
    if (!msg || msg === '{}' || msg.trim() === '') {
        return 'Error al conectar con el servidor. Verificá tu conexión e intentá de nuevo.'
    }
    const mapa = {
        'Invalid login credentials':        'Email o contraseña incorrectos.',
        'Email not confirmed':              'Confirmá tu email antes de ingresar.',
        'User already registered':          'Ya existe una cuenta con ese email.',
        'already registered':              'Ya existe una cuenta con ese email.',
        'Password should be at least':      'La contraseña es demasiado corta.',
        'Unable to validate email address': 'El formato del email no es válido.',
        'For security purposes':            'Esperá unos minutos antes de volver a intentarlo.',
        'Signup requires a valid password': 'Ingresá una contraseña válida.',
        'Email rate limit exceeded':        'Límite de emails alcanzado. Esperá unos minutos e intentá de nuevo.',
        'over_email_send_rate_limit':       'Límite de emails alcanzado. Esperá unos minutos e intentá de nuevo.',
        'smtp':                             'Error al enviar el email de confirmación.',
        'Error sending':                    'Error al enviar el email de confirmación.',
        'Password is too weak':             'La contraseña es muy débil. Usá al menos 8 caracteres, números y mayúsculas.',
        'breached':                         'Esa contraseña fue filtrada en brechas de seguridad. Elegí una diferente.',
    }
    for(const [clave, texto] of Object.entries(mapa)){
        if(msg.toLowerCase().includes(clave.toLowerCase())) return texto
    }
    return msg
}

/* ── Auth ── */
window.login = async () => {
    if (verificarBloqueo()) return

    const email    = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value

    if (!validarEmail(email)) {
        mostrarPopup('error', 'Ingresá un email válido.')
        return
    }
    if (!password) {
        mostrarPopup('error', 'Ingresá tu contraseña.')
        return
    }

    if (!tokenLogin) {
        mostrarPopup('error', 'La verificación de seguridad no se completó. Si usás Edge o Firefox, desactivá la protección de rastreo para este sitio y recargá la página.')
        return
    }

    setLoading('loginBtn', true)
    const { error } = await supabase.auth.signInWithPassword({
        email, password,
        options: { captchaToken: tokenLogin }
    })
    tokenLogin = null
    turnstile.reset()
    setLoading('loginBtn', false)

    if (error) {
        registrarFallo()
        document.getElementById('password').value = ''
        mostrarPopup('error', traducirError(error.message))
    }
}

window.register = async () => {
    const email    = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value

    if (!validarEmail(email)) {
        mostrarPopup('error', 'Ingresá un email válido.')
        return
    }
    const errorPass = validarPasswordFuerte(password)
    if (errorPass) {
        mostrarPopup('error', errorPass)
        return
    }

    if (!document.getElementById('ageCheck').checked) {
        mostrarPopup('error', 'Debés confirmar que tenés 13 años o más para crear una cuenta.')
        return
    }

    if (!tokenLogin) {
        mostrarPopup('error', 'La verificación de seguridad no se completó. Si usás Edge o Firefox, desactivá la protección de rastreo para este sitio y recargá la página.')
        return
    }

    setLoading('registerBtn', true)
    let data, error
    try {
        ;({ data, error } = await supabase.auth.signUp({
            email, password,
            options: { captchaToken: tokenLogin }
        }))
    } catch(e) {
        setLoading('registerBtn', false)
        tokenLogin = null
        turnstile.reset()
        mostrarPopup('error', 'Error de conexión. Verificá tu internet e intentá de nuevo.')
        return
    }
    tokenLogin = null
    turnstile.reset()
    setLoading('registerBtn', false)

    if (error) {
        mostrarPopup('error', traducirError(error.message ?? JSON.stringify(error)))
        return
    }
    if (data.session === null) {
        mostrarPopup('ok', 'Cuenta creada. Revisá tu email y confirmá antes de ingresar.')
    } else {
        mostrarPopup('ok', 'Cuenta creada correctamente. ¡Ya podés ingresar!')
    }
}

window.recuperarPassword = async () => {
    const email = document.getElementById('recovery-email').value.trim()
    if (!validarEmail(email)) {
        mostrarPopup('error', 'Ingresá un email válido.')
        return
    }
    if (!tokenRecovery) {
        mostrarPopup('error', 'Completá la verificación de seguridad.')
        return
    }
    setLoading('recoveryBtn', true)
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://www.casagioia.com.ar/reset-password.html',
        captchaToken: tokenRecovery
    })
    tokenRecovery = null
    setLoading('recoveryBtn', false)

    if (error) {
        mostrarPopup('error', traducirError(error.message))
        return
    }
    mostrarPopup('ok', 'Si el email existe, te mandamos el link. Revisá tu bandeja (y el spam).')
}

window.googleLogin = async () => {
    await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/' }
    })
}

</script>

</body>
</html>
