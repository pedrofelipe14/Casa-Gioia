<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nueva contraseña — Casa Gioia</title>

<link rel="stylesheet" href="css/estilos.css?v=20260809">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">

<style>
.popup-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
    z-index:3000;opacity:0;pointer-events:none;transition:opacity .22s ease;
}
.popup-overlay.visible{ opacity:1; pointer-events:auto; }
.popup-box{
    background:var(--cream);padding:48px 52px 40px;max-width:400px;width:90%;
    text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.14);
    transform:translateY(-12px) scale(.97);transition:transform .22s ease;
}
.popup-overlay.visible .popup-box{ transform:translateY(0) scale(1); }
.popup-icon{ font-size:2rem;margin-bottom:14px;display:block; }
.popup-title{ font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:500;margin-bottom:10px;color:var(--text); }
.popup-msg{ font-size:.85rem;line-height:1.7;color:#6b6460;margin-bottom:28px; }
.popup-btn{
    background:var(--wine);color:white;border:none;padding:11px 32px;
    font-family:'Manrope',sans-serif;font-size:.75rem;letter-spacing:1.5px;
    text-transform:uppercase;cursor:pointer;transition:background .2s;
}
.popup-btn:hover{ background:#6d1542; }

/* Estado de carga */
.reset-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:20px 0;
    color:#999;
    font-size:.85rem;
    letter-spacing:.5px;
}
.reset-state .dot-anim::after{
    content:'';
    animation: dots 1.2s steps(4,end) infinite;
}
@keyframes dots{
    0%   { content:''; }
    25%  { content:'.'; }
    50%  { content:'..'; }
    75%  { content:'...'; }
    100% { content:''; }
}
.reset-invalid{
    text-align:center;
    padding:20px 0;
    color:#999;
}
.reset-invalid p{ margin-bottom:16px; font-size:.85rem; line-height:1.7; }
</style>

</head>
<body>

<header>
<nav class="navbar" id="navbar">
  <div class="logo">
    <a href="/" style="text-decoration:none;color:inherit;">CASA GIOIA</a>
    <span>Moda • Hogar • Design</span>
  </div>
  <button class="mobile-toggle" id="mobileToggle">☰</button>
  <ul class="menu" id="menu">
    <li class="has-submenu">
      <a href="coleccion">Collezione <span class="submenu-arrow">▾</span></a>
      <ul class="submenu">
        <li><button class="submenu-btn">Deco</button></li>
        <li><button class="submenu-btn">Accesorios</button></li>
        <li><button class="submenu-btn">Muebles</button></li>
        <li><button class="submenu-btn">Deli</button></li>
      </ul>
    </li>
    <li><a href="la-casa">Interiorismo</a></li>
    <li><a href="journal">Storia</a></li>
    <li><a href="novita">Novità</a></li>
    <li><a href="contacto">Contacto</a></li>
  </ul>
  <button class="btn-nav" id="userBtn" style="opacity:1;">Ingresar</button>
</nav>
</header>

<!-- POPUP -->
<div class="popup-overlay" id="popup">
  <div class="popup-box">
    <span class="popup-icon" id="popup-icon"></span>
    <div class="popup-title" id="popup-title"></div>
    <p class="popup-msg" id="popup-msg"></p>
    <button class="popup-btn" onclick="cerrarPopup()">OK</button>
  </div>
</div>

<div class="login-box">

    <h1>Casa Gioia</h1>

    <!-- Esperando el token de recuperación -->
    <div id="estado-cargando" class="reset-state">
        <span>Verificando link<span class="dot-anim"></span></span>
    </div>

    <!-- Link inválido o expirado -->
    <div id="estado-invalido" class="reset-invalid" style="display:none;">
        <span style="font-size:1.6rem;display:block;margin-bottom:12px;">!</span>
        <p>El link es inválido o ya expiró.<br>Pedí uno nuevo desde el inicio.</p>
        <a href="login" class="btn-primary" style="display:inline-block;text-decoration:none;text-align:center;">Volver al inicio</a>
    </div>

    <!-- Formulario para nueva contraseña -->
    <div id="estado-form" style="display:none;">

        <p class="auth-subtitle">Elegí una nueva contraseña para tu cuenta.</p>

        <input id="new-password"     type="password" placeholder="Nueva contraseña">
        <input id="confirm-password" type="password" placeholder="Repetir contraseña">

        <button class="btn-primary" onclick="cambiarPassword()">Guardar contraseña</button>

    </div>

</div>

<script src="js/script.js"></script>
<script type="module">

import { supabase } from './js/supabase-client.js'

/* ── Popup con callback opcional ── */
let _popupCb = null

window.mostrarPopup = (tipo, mensaje, onClose = null) => {
    _popupCb = onClose
    document.getElementById('popup-icon').textContent  = tipo === 'ok' ? '✓' : '!'
    document.getElementById('popup-title').textContent = tipo === 'ok' ? '¡Listo!' : 'Algo salió mal'
    document.getElementById('popup-msg').textContent   = mensaje
    document.getElementById('popup').classList.add('visible')
}

window.cerrarPopup = () => {
    document.getElementById('popup').classList.remove('visible')
    if (_popupCb) { const cb = _popupCb; _popupCb = null; cb() }
}

/* ── Detectar si llegamos desde un link de recuperación ── */
const _search = new URLSearchParams(window.location.search)
const _hash   = new URLSearchParams(window.location.hash.replace('#', ''))
const esRecuperacion = _search.has('code') || _hash.get('type') === 'recovery'

function mostrarForm() {
    clearTimeout(timeoutInvalido)
    document.getElementById('estado-cargando').style.display = 'none'
    document.getElementById('estado-invalido').style.display = 'none'
    document.getElementById('estado-form').style.display     = 'block'
}

const timeoutInvalido = setTimeout(() => {
    document.getElementById('estado-cargando').style.display = 'none'
    document.getElementById('estado-invalido').style.display = 'block'
}, 8000)

supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
        mostrarForm()
    } else if (event === 'SIGNED_IN' && esRecuperacion) {
        mostrarForm()
    }
})

/* ── Cambiar contraseña ── */
window.cambiarPassword = async () => {
    const pass1 = document.getElementById('new-password').value
    const pass2 = document.getElementById('confirm-password').value

    if (pass1.length < 6) {
        mostrarPopup('error', 'La contraseña debe tener al menos 6 caracteres.')
        return
    }
    if (pass1 !== pass2) {
        mostrarPopup('error', 'Las contraseñas no coinciden. Verificá y volvé a intentarlo.')
        return
    }

    // Refrescar sesión antes de actualizar por si el token venció o tiene skew de reloj
    await supabase.auth.refreshSession()

    const { error } = await supabase.auth.updateUser({ password: pass1 })

    if (error) {
        const msg = error.message?.toLowerCase().includes('different from the old')
            ? 'Usá una contraseña que no hayas usado antes.'
            : error.status === 422
            ? 'El link expiró o tu reloj está desincronizado. Verificá la zona horaria (UTC-03:00 Buenos Aires) y pedí un nuevo link.'
            : 'Hubo un error al actualizar. Pedí un nuevo link desde el inicio.'
        mostrarPopup('error', msg)
        return
    }

    mostrarPopup('ok', 'Contraseña actualizada correctamente. Te llevamos al inicio.', () => {
        window.location.href = 'login'
    })
}

</script>

</body>
</html>
